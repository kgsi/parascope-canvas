<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Editorial Engine: Pretext による DOM 計測ゼロのリアルタイムテキストリフロー">
  <title>Editorial Engine — Parascope Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body {
      background: radial-gradient(ellipse at 50% 40%, #0f0f14 0%, #0a0a0c 100%);
      color: #e8e4dc; height: 100vh; overflow: hidden;
    }
    body { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }

    #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

    .line {
      position: absolute; white-space: pre; z-index: 1; color: #e8e4dc;
      user-select: text; -webkit-user-select: text;
    }

    .headline-line {
      position: absolute; white-space: pre;
      font-weight: 700; color: #fff; letter-spacing: 0.04em; z-index: 2;
      user-select: text; -webkit-user-select: text;
    }

    .drop-cap {
      position: absolute; pointer-events: none; z-index: 2;
      font-weight: 700; color: #c4a35a;
    }

    .orb {
      position: absolute; border-radius: 50%; pointer-events: none; z-index: 10;
      will-change: transform;
    }
    .pullquote-box {
      position: absolute; pointer-events: none; z-index: 3;
      border-left: 3px solid #6b5a3d; padding-left: 14px;
    }
    .pullquote-line {
      position: absolute; white-space: pre;
      font-style: italic; color: #b8a070;
      user-select: text; -webkit-user-select: text;
    }

    .hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      font: 400 13px/1 'Noto Serif JP', serif;
      color: rgba(255,255,255,0.22); z-index: 100;
      background: rgba(0,0,0,0.45); padding: 8px 18px; border-radius: 999px;
      pointer-events: none; white-space: nowrap;
    }
    .credit {
      position: fixed; right: 16px; bottom: 12px; z-index: 100;
      font: 400 11px/1 'Noto Serif JP', serif;
      color: rgba(255,255,255,0.28);
      text-decoration: none;
    }
    .credit:hover { color: rgba(255,255,255,0.44); }

    @media (max-width: 760px) {
      .hint, .credit { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="hint">光球をドラッグ &middot; クリックで一時停止 &middot; DOM 計測ゼロ</div>
  <a class="credit" href="https://github.com/kgsi/parascope-canvas" target="_blank" rel="noreferrer">Parascope Canvas</a>

  <script type="module" src="./editorial-engine.ts"></script>
</body>
</html>
