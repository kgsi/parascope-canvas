<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parascope Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background: #0a0a0c;
      color: #e8e4dc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 64px;
    }
    .categories {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 480px;
    }
    a.category {
      display: block;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      text-decoration: none;
      color: #e8e4dc;
      transition: all 0.2s;
    }
    a.category:hover {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.03);
    }
    .category-name {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .category-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
    }
    .category-count {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      margin-top: 12px;
    }
    footer {
      margin-top: 80px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
    }
    footer a { color: rgba(255,255,255,0.35); text-decoration: none; }
    footer a:hover { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <h1>Parascope Canvas</h1>
  <p class="subtitle">デザインとAIの実験場</p>

  <div class="categories">
    <a class="category" href="./pretext/">
      <div class="category-name">Pretext</div>
      <div class="category-desc">DOM計測ゼロのテキストレイアウトエンジン。日本語テキストによるMasonry、エディトリアル、流体シミュレーション。</div>
      <div class="category-count">3 demos</div>
    </a>
  </div>

  <footer>
    <a href="https://parascope.design">Parascope</a> · <a href="https://github.com/kgsi/parascope-canvas">GitHub</a>
  </footer>
</body>
</html>
